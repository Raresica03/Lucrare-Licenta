name: Trigger auto deployment for licenta-be-ca

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/licenta-be-ca-AutoDeployTrigger-8f9200c2-bcc6-465b-a626-1fa10d1e430a.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.LICENTABECA_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.LICENTABECA_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.LICENTABECA_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: 
          registryUsername: ${{ secrets.LICENTABECA_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.LICENTABECA_REGISTRY_PASSWORD }}
          containerAppName: licenta-be-ca
          resourceGroup: licenta
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


